
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Shopee Viral IA</title>
<style>
:root {
--bg:#101010;
--panel:#1b1b1b;
--orange:#ff6a00;
--text:#f7f7f7;
--muted:#aaa;
--line:#333;
}
* {box-sizing:border-box}
body {
margin:0;
background:var(--bg);
color:var(--text);
font:15px/1.5 Arial,sans-serif;
}
header {
padding:22px 18px;
background:linear-gradient(135deg,#171717,#292019);
border-bottom:1px solid var(--line);
}
.brand {display:flex;align-items:center;gap:12px}
.logo {
width:46px;height:46px;border-radius:13px;
background:var(--orange);
display:grid;place-items:center;
color:#111;font-weight:900;font-size:22px;
}
h1 {font-size:21px;margin:0}
header p {margin:4px 0 0;color:var(--muted);font-size:13px}
nav {
display:flex;gap:8px;overflow:auto;
padding:12px 16px;background:#151515;
border-bottom:1px solid var(--line);
}
nav a {
color:#ddd;text-decoration:none;padding:9px 13px;
border-radius:9px;white-space:nowrap;font-size:13px;
}
nav a.active,nav a:hover {
background:var(--orange);color:#111;font-weight:bold;
}
main {max-width:980px;margin:20px auto;padding:0 16px}
.hero {
padding:22px;border:1px solid #3a2a1e;
border-radius:16px;
background:linear-gradient(120deg,#21170f,#191919);
margin-bottom:18px;
}
.hero h2 {font-size:23px;margin:0 0 6px}
.hero h2 span {color:var(--orange)}
.hero p {color:#c4c4c4;margin:0}
.grid {
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:14px;
}
.card {
background:var(--panel);
border:1px solid var(--line);
border-radius:14px;
padding:17px;
margin-bottom:15px;
}
.card h3 {margin:0 0 12px;font-size:17px}
.card h3 b {color:var(--orange)}
label {
display:block;color:#ddd;font-size:13px;
margin:10px 0 5px;
}
input,select,textarea {
width:100%;background:#101010;color:var(--text);
border:1px solid #444;border-radius:9px;
padding:11px;font:inherit;
}
input[type=file] {padding:9px}
.row {display:grid;grid-template-columns:1fr 1fr;gap:10px}
button {
border:0;border-radius:9px;background:var(--orange);
color:#111;font-weight:700;padding:12px 15px;
margin-top:13px;cursor:pointer;
}
.note {font-size:12px;color:var(--muted);margin:10px 0 0}
.pill {
display:inline-block;background:#302116;
color:#ff9a52;border:1px solid #613719;
border-radius:30px;padding:4px 9px;
font-size:11px;margin:3px;
}
.status {
padding:12px;border-radius:10px;background:#151515;
border:1px dashed #555;color:#bbb;font-size:13px;
}
footer {
text-align:center;color:#777;
font-size:12px;padding:25px;
}
@media(max-width:650px) {
.grid,.row {grid-template-columns:1fr}
.hero h2 {font-size:20px}
}
</style>
</head>
<body>
<header>
<div class="brand">
<div class="logo">SV</div>
<div>
<h1>Shopee Viral IA</h1>
<p>Garimpo inteligente • Conteúdo para Shopee Vídeos</p>
</div>
</div>
</header>
<nav>
<a href="#inicio">Início</a>
<a href="#garimpo">Garimpo</a>
<a href="#videos">Criar vídeo</a>
<a href="#conformidade">Conformidade</a>
</nav>
